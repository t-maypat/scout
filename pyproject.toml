[project]
name = "scout"
version = "0.1.0"
description = "Find open source repositories worth contributing to, and prove you can build them"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "structlog>=24.1",
    "tomli-w>=1.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
scout = "scout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
include = ["scout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
