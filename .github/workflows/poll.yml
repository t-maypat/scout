name: poll

# Observing, not interrupting. The digest polls for itself, so this exists for one reason:
# transitions are derived by comparing consecutive snapshots, and "just came free" cannot
# be seen from a single look a day.
#
# Six-hourly rather than every 15 minutes. A `*/15` cron asked for ~1,050 runs here and
# GitHub created 76 of them - dense schedules are dropped, not queued - and each surviving
# run wrote a commit, which is how 69 of main's 108 commits came to say nothing but "poll:".
# Four predictable looks a day is worth more than eight unpredictable ones.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the digest: both write the `data` branch, so they queue rather than race.
concurrency:
  group: scout-log
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Poll the watchlist
        env:
          SCOUT_GITHUB_TOKEN: ${{ secrets.SCOUT_GITHUB_TOKEN }}
        run: uv run scout poll

      - name: Commit new observations
        working-directory: data
        run: |
          if [ -z "$(git status --porcelain events state)" ]; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "scout"
          git config user.email "scout@users.noreply.github.com"
          git add events state
          git commit -m "log: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
