name: digest

# Interrupting, not observing. Once a day, when there is actually time to act on it.
# 14:30 UTC is 20:00 IST.
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest instead of sending it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scout-digest

jobs:
  digest:
    runs-on: ubuntu-latest
    # A hung job must not sit there consuming minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Build and send
        env:
          SCOUT_GITHUB_TOKEN: ${{ secrets.SCOUT_GITHUB_TOKEN }}
          SCOUT_DISCORD_WEBHOOK_URL: ${{ secrets.SCOUT_DISCORD_WEBHOOK_URL }}
          # Without these the scheduled run silently falls back to the webhook:
          # no threads, no buttons, and nothing in the log says so.
          SCOUT_DISCORD_BOT_TOKEN: ${{ secrets.SCOUT_DISCORD_BOT_TOKEN }}
          SCOUT_DISCORD_CHANNEL_ID: ${{ secrets.SCOUT_DISCORD_CHANNEL_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run scout digest
          else
            uv run scout digest --send
          fi

      - name: Record what was sent
        # always(): a send that fails partway has still posted items and saved the thread
        # ids. Skipping this on failure threw both away, so the next run opened a second
        # thread and sent those items again. The job still reports the send as failed.
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          if [ -z "$(git status --porcelain events state)" ]; then exit 0; fi
          git config user.name "scout"
          git config user.email "scout@users.noreply.github.com"
          # state/ holds today's Discord thread ids. Without it a second run on the
          # same day cannot find the thread and opens a duplicate.
          git add events state
          git commit -m "digest sent: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
